apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: capstone-phoenix
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Sudo-drew-dev/capstone-phoenix
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: taskapp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
