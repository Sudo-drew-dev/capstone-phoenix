- name: Install ufw and fail2ban
  apt:
    name:
      - ufw
      - fail2ban
    state: present
    update_cache: yes

- name: Allow SSH through ufw
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow all traffic between cluster nodes
  community.general.ufw:
    rule: allow
    src: "10.0.1.0/24"

- name: Enable ufw
  community.general.ufw:
    state: enabled
    policy: deny

- name: Ensure fail2ban is running
  service:
    name: fail2ban
    state: started
    enabled: yes
